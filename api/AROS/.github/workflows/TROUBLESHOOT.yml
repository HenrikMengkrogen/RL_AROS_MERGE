name: TROUBLESHOOT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          #- name: macOS Intel
          #  os: macos-15-intel
          #  target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Linux x86_64 (Ubuntu 22.04)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: Linux x86_64 (Ubuntu 24.04)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - name: Linux ARM64 (Ubuntu 22.04)
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

          - name: Linux ARM64 (Ubuntu 24.04)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - name: Windows x64 (MinGW64)
            os: windows-latest
            target: x86_64-pc-windows-gnu
            msystem: MINGW64

          - name: Windows ARM64 (CLANGARM64)
            os: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            msystem: CLANGARM64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # On macOS
      - name: Run setup, test, build and run
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x ./setup.sh
          source ./setup.sh

          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv --locked --target "${{ matrix.target }}"
          cargo run --locked --target "${{ matrix.target }}"

      # On Linux
      - name: Run setup, test, build and run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./setup.sh
          source ./setup.sh

          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv --locked --target "${{ matrix.target }}"
          cargo run --locked --target "${{ matrix.target }}"

      # On Windows
      - name: Verify LFS files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git lfs pull
          git lfs checkout
          HEADER="vendor/RNAlib/include/ViennaRNA/fold_compound.h"
          head -n 5 "$HEADER"
          if head -n 1 "$HEADER" | grep -q "git-lfs.github.com/spec"; then
            echo "ERROR: $HEADER is still a Git LFS pointer."
            exit 1
          fi

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem || 'MINGW64' }}
          update: true
          path-type: minimal
          cache: true
          suppress-deprecation-warnings: msystem-mingw64 msystem-mingw32

      - name: Setup, test, and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "MSYSTEM=$MSYSTEM  target=${{ matrix.target }}  arch=$(uname -m)"

          chmod +x ./setup.sh
          source ./setup.sh

          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          cargo --version
          rustup target add "${{ matrix.target }}"

          cargo test --locked --target "${{ matrix.target }}"
          cargo build -vv --locked --target "${{ matrix.target }}"
          cargo run --locked --target "${{ matrix.target }}"